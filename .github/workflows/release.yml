name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            echo "Expected semantic tag like v0.1.0" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Ensure tag does not exist
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag already exists: ${VERSION}" >&2
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          mkdir -p dist

          platforms=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for platform in "${platforms[@]}"; do
            IFS=' ' read -r GOOS GOARCH <<< "${platform}"
            OUTPUT="dist/jan-${GOOS}-${GOARCH}"
            echo "Building ${OUTPUT}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${OUTPUT}" ./cmd/jan
          done

          (
            cd dist
            sha256sum jan-* > checksums.txt
          )

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/jan-linux-amd64
            dist/jan-linux-arm64
            dist/jan-darwin-amd64
            dist/jan-darwin-arm64
            dist/checksums.txt
